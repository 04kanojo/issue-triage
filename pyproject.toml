[project]
name = "issue-triage"
version = "0.1.0"
description = "Open-source issue triage agent: duplicate detection, labels, reply drafts, with a public eval."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=8.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"